name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | sed -E -n 's/.*version "([0-9]+).*/\1/p' | head -n 1)

          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Active Java major version could not be detected!"
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java major version $JAVA_MAJOR is lower than required minimum version 17!"
            exit 1
          fi

          echo "Java environment verified successfully: Java $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore!"
            exit 1
          fi

          echo "Temporary debug keystore verified successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK!"
            echo "Searching inside app/build/outputs/apk for any generated APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk" -type f
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is not a regular file!"
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is empty (0 bytes)!"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: $EXPECTED_APK does not have the .apk extension!"
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk!"
            exit 1
          fi

          echo "APK verification passed: $EXPECTED_APK ($(ls -lh "$EXPECTED_APK" | awk '{print $5}'))"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP}/apk_release_asset"
          mkdir -p "$ASSET_DIR"

          REPO_RAW="${GITHUB_REPOSITORY#*/}"
          REPO_CLEAN=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$REPO_CLEAN" ]; then
            REPO_CLEAN="app"
          fi

          RELEASE_FILENAME="${REPO_CLEAN}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_ASSET_PATH="${ASSET_DIR}/${RELEASE_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_ASSET_PATH"

          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $RELEASE_ASSET_PATH!"
            exit 1
          fi

          echo "Release asset prepared: $RELEASE_ASSET_PATH"
          echo "asset_path=$RELEASE_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version

          if [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset file does not exist at $ASSET_PATH!"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset is empty!"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset $ASSET_PATH is not an .apk file!"
              exit 1
              ;;
          esac

          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<EOF
### Debug APK Build

- **Build Type**: Automatically generated debug APK
- **Builder**: GitHub Actions
- **Workflow Run Number**: ${GITHUB_RUN_NUMBER}
- **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
- **Source Commit SHA**: ${GITHUB_SHA}

> **Notice:**
> - This APK is intended for testing and evaluation purposes.
> - This is NOT a Google Play Store production release.
> - This build is signed only with a temporary debug keystore.
EOF
)

          echo "Publishing release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" \
            "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Release published successfully."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            gh release view "$TAG_NAME"
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url)
            RELEASE_TITLE=$(gh release view "$TAG_NAME" --json name -q .name)

            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
## ✅ Debug APK Build & Release Succeeded

- **Release Tag:** \`$TAG_NAME\`
- **Release Title:** $RELEASE_TITLE
- **Release Page:** [$RELEASE_URL]($RELEASE_URL)
- **APK Filename:** \`$ASSET_NAME\`

### How to Download:
1. Open the [GitHub Release Page]($RELEASE_URL).
2. Look under the **Assets** section and click on \`$ASSET_NAME\` to download the APK directly to your phone or computer.
3. The standard GitHub Actions artifact **\`app-debug-apk\`** is also preserved in this workflow run as a backup.
EOF

          else
            echo "::warning ::GitHub Release publishing could not be completed or encountered an error."
            echo "The debug APK build and artifact upload succeeded. Artifact name: app-debug-apk"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
## ⚠️ Debug APK Built (Release Publishing Notice)

- **APK Build Status:** Succeeded
- **Artifact Status:** Succeeded (Uploaded as \`app-debug-apk\`)
- **GitHub Release Status:** Publishing could not be completed or encountered an issue.
- **Backup Download:** The debug APK remains available as a workflow artifact named **\`app-debug-apk\`** on this workflow run's summary page.
EOF
          fi
